const TEXT_QUANTITY_LIMITS = Object.freeze({

    optimal: Object.freeze({ characters: 900, words: 150, sentences: 9 })
});

function classifyTextQuantity(characterCount, wordCount, sentenceCount) {
    const belowMinimum =
        characterCount < TEXT_QUANTITY_LIMITS.minimum.characters ||
        wordCount < TEXT_QUANTITY_LIMITS.minimum.words ||
        sentenceCount < TEXT_QUANTITY_LIMITS.minimum.sentences;
    if (belowMinimum) return "insufficient";

    const belowOptimal =
        characterCount < TEXT_QUANTITY_LIMITS.optimal.characters ||
        wordCount < TEXT_QUANTITY_LIMITS.optimal.words ||
        sentenceCount < TEXT_QUANTITY_LIMITS.optimal.sentences;
    return belowOptimal ? "critical" : "valid";
}


function canonicalizeDTAIntegrity(value, seen = new WeakSet()) {
    if (value === null) return "null";
    const type = typeof value;
    if (type === "string") return "s:" + JSON.stringify(value);
    if (type === "number") {
        if (Number.isNaN(value)) return "n:NaN";
        if (value === Infinity) return "n:+Infinity";
        if (value === -Infinity) return "n:-Infinity";
        if (Object.is(value, -0)) return "n:-0";
        return "n:" + String(value);
    }
    if (type === "boolean") return value ? "b:1" : "b:0";
    if (type === "undefined") return "u:";
    if (type === "function") {
        return "f:" + Function.prototype.toString.call(value).replace(/\r\n?/gu, "\n");
    }
    if (value instanceof RegExp) return "r:" + value.source + "/" + value.flags;
    if (value instanceof Date) return "d:" + value.toISOString();
    if (seen.has(value)) return "circular";
    seen.add(value);
    if (Array.isArray(value)) {
        return "a:[" + value.map(item => canonicalizeDTAIntegrity(item, seen)).join("|") + "]";
    }
    if (value instanceof Set) {
        return "set:[" + Array.from(value, item => canonicalizeDTAIntegrity(item, seen)).join("|") + "]";
    }
    if (value instanceof Map) {
        return "map:[" + Array.from(value, entry =>
            canonicalizeDTAIntegrity(entry[0], seen) + "=>" + canonicalizeDTAIntegrity(entry[1], seen)
        ).join("|") + "]";
    }
    const keys = Object.keys(value).sort();
    return "o:{" + keys.map(key =>
        JSON.stringify(key) + ":" + canonicalizeDTAIntegrity(value[key], seen)
    ).join("|") + "}";

function blaBlaSoftplus(value) {
  if (value > 40) return value;
  if (value < -40) return Math.exp(value);
  return Math.log1p(Math.exp(value));
}

function predictBlaBlaMeter(nnValues) {
  const m = BLABLAMETER_NN_MODEL;
  if (!Array.isArray(nnValues) || nnValues.length !== m.input_size) {
    throw new Error(`Expected ${m.input_size} NN input values.`);
  }
  const x = nnValues.map(
    (value, i) => (Number(value) - m.scaler.mean[i]) / m.scaler.scale[i],
  );
  const hidden = m.hidden_bias.map((bias, j) => {
    let value = bias;
    for (let i = 0; i < m.input_size; i += 1) {
      value += x[i] * m.input_weights[i][j];
    }
    return Math.tanh(value);
  });
  let raw = m.output_bias;
  for (let j = 0; j < m.hidden_size; j += 1) {
    raw += hidden[j] * m.output_weights[j];
  }
  return blaBlaSoftplus(raw);
}

function blaBlaMeterNNValues(data) {
    const values = [
        data.excessChars8PerWord,
        data.ratioLong16,
        data.uniqueDiagnosticData.ratio,
        data.ratioFamilyHits,
        data.allFamilyRatio,
        data.abstractionClusterData.unboundTokenRatio,
        data.jargonTierRatios.B,
        data.diagnosticOverlapData.jargonSuffix / Math.max(1, data.wordCount),
        data.jargonFamilyResults.innovation.ratio,
        data.jargonFamilyResults.management.ratio,
        data.jargonFamilyResults.strategie.ratio,
        data.avgSentenceLength,
        data.jargonTierRatios.C,
        data.jargonTierRatios.A,
        data.jargonTierRatios.E,
        data.jargonFamilyResults.faktor.ratio,
        data.jargonFamilyResults.implementierung.ratio,
        data.jargonFamilyResults.transparenz.ratio,
        data.jargonFamilyResults.erfolg.ratio
    ];

    return values.map((value, index) => {
        const numeric = Number(value);
        if (!Number.isFinite(numeric)) {
            throw new Error("Ungültiger NN-Parameter an Position " + (index + 1) + ".");
        }
        return Number(numeric.toFixed(4));
    });
}

        0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5,
        0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
        0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208,
        0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2

        0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a,
        0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19
    ];

    for (let index = 0; index < bytes.length; index++) {
        const wordIndex = index >>> 2;
        words[wordIndex] = (words[wordIndex] || 0) |
            (bytes[index] << (24 - (index % 4) * 8));
    }

    const paddingWord = bytes.length >>> 2;
    words[paddingWord] = (words[paddingWord] || 0) |
        (0x80 << (24 - (bytes.length % 4) * 8));

        (value >>> amount) | (value << (32 - amount));

        const schedule = new Array(64);

        for (let index = 16; index < 64; index++) {
            const previous15 = schedule[index - 15];
            const previous2 = schedule[index - 2];
            const sigma0 =
                rotateRight(previous15, 7) ^
                rotateRight(previous15, 18) ^
                (previous15 >>> 3);

                rotateRight(previous2, 17) ^
                rotateRight(previous2, 19) ^
                (previous2 >>> 10);
            schedule[index] = (
                schedule[index - 16] +
                sigma0 +
                schedule[index - 7] +
                sigma1

        }

        let [a, b, c, d, e, f, g, h] = hash;
        for (let index = 0; index < 64; index++) {

                rotateRight(e, 6) ^
                rotateRight(e, 11) ^
                rotateRight(e, 25);
            const choose = (e & f) ^ (~e & g);

                h + sum1 + choose + constants[index] + schedule[index]

                rotateRight(a, 2) ^
                rotateRight(a, 13) ^
                rotateRight(a, 22);

            const temporary2 = (sum0 + majority) >>> 0;

            g = f;
            f = e;
            e = (d + temporary1) >>> 0;
            d = c;
            c = b;
            b = a;
            a = (temporary1 + temporary2) >>> 0;
        }

        hash[0] = (hash[0] + a) >>> 0;
        hash[1] = (hash[1] + b) >>> 0;
        hash[2] = (hash[2] + c) >>> 0;
        hash[3] = (hash[3] + d) >>> 0;
        hash[4] = (hash[4] + e) >>> 0;
        hash[5] = (hash[5] + f) >>> 0;
        hash[6] = (hash[6] + g) >>> 0;
        hash[7] = (hash[7] + h) >>> 0;
    }

    return hash
        .map(value => value.toString(16).padStart(8, "0"))

function clearText() {
    closeAllInsights();
    document.getElementById("textInput").value = "";
    document.getElementById("result").innerHTML = "";
    lastAnalysisData = null;
    setActiveBlaBlaMeterStage(null);
    document.getElementById("textInput").focus();
}

function copyToClipboard() {
    if (!lastAnalysisData) {
        alert("Bitte erst einen Text analysieren.");
        return;
    }

    const copyContainer = document.createElement("div");
    copyContainer.style.position = "fixed";
    copyContainer.style.left = "-10000px";
    copyContainer.style.top = "0";
    copyContainer.innerHTML = renderFullAnalysis(lastAnalysisData);
    document.body.appendChild(copyContainer);
    const textToCopy = copyContainer.innerText;
    document.body.removeChild(copyContainer);

    navigator.clipboard.writeText(textToCopy).then(() => {
        flashButton(".copy-btn", "Kopiert!");
    }).catch(err => console.error("Fehler beim Kopieren:", err));
}

function flashButton(selector, message) {
    const button = document.querySelector(selector);
    if (!button) return;
    const originalText = button.textContent;
    button.textContent = message;
    setTimeout(() => { button.textContent = originalText; }, 2000);
}

function renderInsightsToolbar() {
    return (
        '<div class="insights-toolbar" aria-label="Insights-Aktionen">' +
        '<button id="bbm-original" class="btn-bbm" onclick="sendToBlaBlaMeter(\'original\')" title="Originaltext anzeigen und an BlaBlaMeter senden" aria-pressed="false">BBM-O</button>' +
        '<button id="bbm-technical" class="btn-bbm" onclick="sendToBlaBlaMeter(\'technical\')" title="Technisch bereinigten Text anzeigen und an BlaBlaMeter senden" aria-pressed="false">BBM-T</button>' +
        '<button id="bbm-revised" class="btn-bbm" onclick="sendToBlaBlaMeter(\'revised\')" title="Überarbeiteten Text anzeigen und an BlaBlaMeter senden" aria-pressed="false">BBM-Ü</button>' +
        '<button id="deepInsightsButton" class="show-btn" onclick="openDeepInsights()">Deep Insights</button>' +
        '<button class="copy-btn" onclick="copyToClipboard()">Copy</button>' +
        '<button class="csv-btn" onclick="copyAsCSV()">CSV kopieren</button>' +
        '<button class="header-btn" onclick="copyHeader()">Header kopieren</button>' +
        '</div>'
    );
}

function renderAuthorInsights(data) {
    return renderInsightsVersion(data) + renderSummary(data);
}

function renderDeepInsightsAnalysis(data) {
    return renderSummary(data) + renderDetailedSections(data) + renderTransformationLog(data);
}

function openInsights() {
    if (!lastAnalysisData) {
        alert("Bitte erst einen Text analysieren.");
        return;
    }

    closeAllInsights();

    const overlay = document.createElement("div");
    overlay.id = "insightsOverlay";
    overlay.className = "analysis-overlay modal-stack";
    overlay.addEventListener("click", event => {
        if (event.target === overlay) closeAllInsights();
    });

    const modal = document.createElement("div");
    modal.id = "insightsModal";
    modal.className = "analysis-modal insights-modal";
    modal.setAttribute("role", "dialog");
    modal.setAttribute("aria-modal", "true");
    modal.setAttribute("aria-labelledby", "insightsModalTitle");
    modal.innerHTML =
        '<button class="modal-close" onclick="closeAllInsights()" aria-label="Insights schließen">×</button>' +
        renderInsightsToolbar() +
        '<h2 id="insightsModalTitle">Insights</h2>' +
        renderAuthorInsights(lastAnalysisData);

    overlay.appendChild(modal);
    document.body.appendChild(overlay);
    document.body.classList.add("modal-open");
    document.addEventListener("keydown", handleInsightsEscape);
    setActiveBlaBlaMeterStage(activeBlaBlaMeterStage);

    const closeButton = modal.querySelector(".modal-close");
    if (closeButton) closeButton.focus();
}

function openDeepInsights() {
    if (!lastAnalysisData) {
        alert("Bitte erst einen Text analysieren.");
        return;
    }

    let overlay = document.getElementById("insightsOverlay");
    if (!overlay) {
        openInsights();
        overlay = document.getElementById("insightsOverlay");
    }
    if (!overlay) return;

    closeDeepInsights();

    const modal = document.createElement("div");
    modal.id = "deepInsightsModal";
    modal.className = "analysis-modal deep-insights-modal";
    modal.setAttribute("role", "dialog");
    modal.setAttribute("aria-modal", "true");
    modal.setAttribute("aria-labelledby", "deepInsightsModalTitle");
    modal.innerHTML =
        '<button class="modal-close" onclick="closeDeepInsights()" aria-label="Deep Insights schließen">×</button>' +
        '<h2 id="deepInsightsModalTitle">Deep Insights</h2>' +
        renderDeepInsightsAnalysis(lastAnalysisData);

    overlay.appendChild(modal);
    const closeButton = modal.querySelector(".modal-close");
    if (closeButton) closeButton.focus();
}

function closeDeepInsights() {
    const modal = document.getElementById("deepInsightsModal");
    if (modal) modal.remove();
    const trigger = document.getElementById("deepInsightsButton");
    if (trigger) trigger.focus();
}

function handleInsightsEscape(event) {
    if (event.key !== "Escape") return;
    if (document.getElementById("deepInsightsModal")) {
        closeDeepInsights();
    } else {
        closeAllInsights();
    }
}

function closeAllInsights() {
    const overlay = document.getElementById("insightsOverlay");
    if (overlay) overlay.remove();
    document.body.classList.remove("modal-open");
    document.removeEventListener("keydown", handleInsightsEscape);
}

function openInBlaBlaMeter(text) {
    if (!text || !text.trim()) {
        alert("Bitte zuerst einen Text analysieren.");
        return;
    }

    const form = document.createElement("form");
    form.action = "http://www.blablameter.de/index.php";
    form.method = "POST";
    form.target = "blablameter_window";

    const inputText = document.createElement("input");
    inputText.type = "hidden";
    inputText.name = "bc_ip";
    inputText.value = text;
    form.appendChild(inputText);

    const inputSubmit = document.createElement("input");
    inputSubmit.type = "hidden";
    inputSubmit.name = "Text testen";
    inputSubmit.value = "Text testen";
    form.appendChild(inputSubmit);

    document.body.appendChild(form);
    form.submit();
    document.body.removeChild(form);
}

function setActiveBlaBlaMeterStage(stage) {
    activeBlaBlaMeterStage = stage;
    for (const name of ["original", "technical", "revised"]) {
        const button = document.getElementById("bbm-" + name);
        if (!button) continue;
        const active = name === stage;
        button.classList.toggle("active", active);
        button.setAttribute("aria-pressed", String(active));
    }
}

function showBlaBlaMeterStage(stage) {
    if (!lastAnalysisData) {
        alert("Bitte zuerst einen Text analysieren.");
        return null;
    }

    const texts = {
        original: lastAnalysisData.originalText,
        technical: lastAnalysisData.technicalText,
        revised: lastAnalysisData.revisedText
    };

    if (!Object.prototype.hasOwnProperty.call(texts, stage)) {
        alert("Unbekannte Textstufe.");
        return null;
    }

    document.getElementById("textInput").value = texts[stage];
    setActiveBlaBlaMeterStage(stage);
    return texts[stage];
}

function sendToBlaBlaMeter(stage) {
    const text = showBlaBlaMeterStage(stage);
    if (text !== null) openInBlaBlaMeter(text);
}

function removeBalancedBrackets(text) {
    const protectedHits = [];
    const removedHits = [];
    let working = text;

    // Akronyme unmittelbar vor einem Schrägstrich dürfen durch die
    // Klammerentfernung nicht zu einem führenden Schrägstrich werden.
    working = working.replace(/\(([A-ZÄÖÜ0-9][A-ZÄÖÜ0-9.-]{1,15})\)(?=\s*\/)/gu,
        (match, inner) => {
            protectedHits.push(match + " → Klammerzeichen entfernt, technischer Inhalt erhalten");
            return inner;
        });

    // Eingeschobene Kürzel mit Ergänzungsbindestrich werden entfernt, ohne
    // Doppelbindestriche oder offene Ergänzungsstrukturen zu erzeugen.
    working = working.replace(/([\p{L}]-)\s*\([A-ZÄÖÜ0-9][A-ZÄÖÜ0-9.-]{1,15}-\)(?=\p{L})/gu,
        (match, prefix) => {
            removedHits.push(match);
            return prefix;
        });
    working = working.replace(/-\([A-ZÄÖÜ0-9][A-ZÄÖÜ0-9.-]{1,15}-\)(?=\p{L})/gu,
        match => {
            removedHits.push(match);
            return "-";
        });
    working = working.replace(/\([A-ZÄÖÜ0-9][A-ZÄÖÜ0-9.-]{1,15}-\)(?=\p{L})/gu,
        match => {
            removedHits.push(match);
            return "";
        });

    const openingToClosing = { "(": ")", "[": "]", "{": "}" };
    const opening = new Set(Object.keys(openingToClosing));
    const closing = new Set(Object.values(openingToClosing));
    const stack = [];
    const ranges = [];
    let blockStart = -1;

    for (let index = 0; index < working.length; index++) {
        const character = working[index];
        if (opening.has(character)) {
            if (stack.length === 0) blockStart = index;
            stack.push(openingToClosing[character]);
            continue;
        }
        if (closing.has(character) && stack.length > 0 && character === stack[stack.length - 1]) {
            stack.pop();
            if (stack.length === 0 && blockStart >= 0) {
                ranges.push([blockStart, index]);
                blockStart = -1;
            }
        }
    }

    if (ranges.length === 0) {
        return {
            text: working,
            blockCount: removedHits.length,
            removedChars: removedHits.reduce((sum, value) => sum + value.length, 0),
            hits: removedHits,
            protectedHits
        };
    }

    let result = "";
    let cursor = 0;
    let removedChars = removedHits.reduce((sum, value) => sum + value.length, 0);
    for (const [start, end] of ranges) {
        const block = working.slice(start, end + 1);
        const inner = block.slice(1, -1).trim();
        const before = working.slice(Math.max(0, start - 12), start);
        const after = working.slice(end + 1, end + 13);
        const isUnitDenominator = /\/\s*$/u.test(before) &&
            /^[\p{L}\p{N}µμΩ°·*/.^+−-]{1,24}$/u.test(inner);
        const isTechnicalInline = /^\s*\/\s*/u.test(after) &&
            /^[A-ZÄÖÜ0-9][A-ZÄÖÜ0-9.-]{1,15}$/u.test(inner);

        result += working.slice(cursor, start);
        if (isUnitDenominator) {
            result += block;
            protectedHits.push(block + " → technische Einheitenklammer erhalten");
        } else if (isTechnicalInline) {
            result += inner;
            protectedHits.push(block + " → Klammerzeichen entfernt, technischer Inhalt erhalten");
        } else {
            result += " ";
            removedChars += block.length;
            removedHits.push(block);
        }
        cursor = end + 1;
    }
    result += working.slice(cursor);

    result = result
        .replace(/-\s*-/g, "-")
        .replace(/\s+\//g, " /")
        .replace(/\/\s+/g, "/")
        .replace(/[ \t]{2,}/g, " ");

    return {
        text: result,
        blockCount: removedHits.length,
        removedChars,
        hits: removedHits,
        protectedHits
    };
}

function removeSlashCitationMarkers(text) {
    const hits = [];
    let removedChars = 0;
    const markerRegex = /(^|[\s[{"'„‚])\/\s*\d{1,4}(?:\s*[-–]\s*\d{1,4})?\s*\/(?=$|[\s\]},.;:!?"“‘])/gu;

    const result = text.replace(markerRegex, (match, prefix) => {
        const marker = match.slice(prefix.length);
        hits.push(marker.replace(/\s+/g, " ").trim());
        removedChars += marker.length;
        return prefix;
    });

    return {
        text: result,
        count: hits.length,
        removedChars,
        hits
    };
}

function countPatternGroup(text, group, denominator) {
    const acceptedRanges = [];
    const hits = [];

    for (const pattern of group.patterns) {
        const flags = pattern.regex.flags.includes("g")
            ? pattern.regex.flags
            : pattern.regex.flags + "g";
        const regex = new RegExp(pattern.regex.source, flags);
        let match;

        while ((match = regex.exec(text)) !== null) {
            const start = match.index;
            const end = start + match[0].length;
            const overlaps = acceptedRanges.some(range => {
                return start < range.end && end > range.start;
            });

            if (!overlaps) {
                acceptedRanges.push({ start, end });
                hits.push({
                    start,
                    text: match[0].replace(/\s+/g, " ").trim(),
                    label: pattern.label
                });
            }

            if (match.index === regex.lastIndex) regex.lastIndex++;
        }
    }

    hits.sort((a, b) => a.start - b.start);
    return {
        count: hits.length,
        ratio: hits.length / Math.max(1, denominator),
        hits: hits.map(hit => hit.text + " → " + hit.label)
    };
}

function detectDecisionAvoidance(text) {

    // Echte Absatzabstände mit zwei oder mehr Leerzeilen bleiben erhalten.
    if (ratio < 0.72 || singleBlankGaps < 4) return text;

    const output = [];
    let removed = 0;
    for (let index = 0; index < lines.length; index++) {
        const line = lines[index];
        if (line.trim() || index === 0 || index === lines.length - 1) {
            output.push(line);
            continue;
        }
        const previousNonEmpty = index > 0 && lines[index - 1].trim();
        const nextNonEmpty = index + 1 < lines.length && lines[index + 1].trim();
        const isolatedBlank = previousNonEmpty && nextNonEmpty;
        if (isolatedBlank) {
            removed++;
            continue;
        }
        output.push(line);
    }

    if (removed > 0) {
        audit.detectedInterleavedPdfBlankPattern = 1;
        audit.removedInterleavedPdfBlankLines += removed;
        audit.interleavedPdfBlankRatio = ratio;
    }
    return output.join("\n");
}


function removeProbableFootnoteMarkers1042(text, audit) {
    // V10.4.3: juristische/technische Nummernbindungen haben absoluten Vorrang
    // vor der dokumentweiten Fußnoten-Sequenzheuristik.
    const candidates = [];
    const regex = /\b([1-9]\d?)\b/gu;
    let match;

    const strongLeftBinding = /(?:\b(?:abb\.?|abbildung|bild|tab\.?|tabelle|kap\.?|kapitel|seite|seiten|s\.?|nr\.?|nummer|werk|gebäude|typ|variante|stufe|gruppe|klasse|modell|version|phase|schritt|punkt|anlage|anhang|abschnitt|abs\.?|absatz|satz|paragraf|paragraph|zeile|spalte|formel|gleichung|revisionsstufe)\s*)$/iu;
    const chainedStructuralBinding = /(?:\b(?:nr\.?|nummer|abs\.?|absatz|satz|paragraf|paragraph|kap\.?|kapitel|seite|seiten|punkt|anlage|anhang|abschnitt)\s*\d{1,3}[a-z]?\s*(?:,|und|oder|bis|–|—|-)\s*)$/iu;
    const strongRightUnit = /^\s*(?:(?:%|€|\$)(?=\s|$)|(?:prozent|eur|usd|mm|cm|m|km|m²|m2|km²|kg|g|mg|t|ml|l|hz|pa|bar|kwh|mwh|w|at|paletten?|stücke?|stk\.?|minuten?|stunden?|tage?|wochen?|monate?|jahre?)\b)/iu;

    while ((match = regex.exec(text)) !== null) {
        const value = Number(match[1]);
        const start = match.index;
        const end = start + match[1].length;
        const left = text.slice(Math.max(0, start - 48), start);
        const right = text.slice(end, Math.min(text.length, end + 48));
        const lineStart = text.lastIndexOf("\n", start - 1) + 1;
        const lineEndRaw = text.indexOf("\n", end);
        const lineEnd = lineEndRaw < 0 ? text.length : lineEndRaw;
        const line = text.slice(lineStart, lineEnd);
        const beforeOnLine = text.slice(lineStart, start);

        let protectedNumber = false;
        // Bereits strukturell gebundene Zahlen niemals als Fußnote behandeln.
        if (/^\s*\d{1,2}\s*$/u.test(line)) protectedNumber = true; // Seitenzahl: späterer OCR-Schritt
        if (/^\s*$/u.test(beforeOnLine) && /^\s*[.)\]:-]\s*\S/u.test(right)) protectedNumber = true; // Listen-/Gliederungsnummer
        if (strongLeftBinding.test(left)) protectedNumber = true;
        if (chainedStructuralBinding.test(left)) protectedNumber = true;
        // Zusammengesetzte juristische Verweise wie „Absatz 3 Satz 1“ oder
        // „Nummer 1 und 2“ bleiben vollständig erhalten.
        if (/(?:\b(?:abs\.?|absatz|satz|nr\.?|nummer|paragraf|paragraph)\s*\d{1,3}[a-z]?\s+)(?:abs\.?|absatz|satz|nr\.?|nummer)\s*$/iu.test(left)) protectedNumber = true;
        if (strongRightUnit.test(right)) protectedNumber = true;
        if (/\d[.,]$/u.test(left) || /^[.,]\d/u.test(right)) protectedNumber = true; // Dezimal-/Gliederungszahl
        if (/[§#]\s*$/u.test(left)) protectedNumber = true;

        candidates.push({ value, start, end, left, right, protectedNumber, remove: false, score: 0 });
    }

    const eligible = candidates.filter(c => !c.protectedNumber);
    let sequenceLikely = false;
    if (eligible.length >= 3) {
        let orderedSteps = 0;
        let comparableSteps = 0;
        for (let i = 1; i < eligible.length; i++) {
            const diff = eligible[i].value - eligible[i - 1].value;
            comparableSteps++;
            if (diff > 0 && diff <= 3) orderedSteps++;
        }
        sequenceLikely = comparableSteps > 0 && orderedSteps / comparableSteps >= 0.60;
    }

    for (const c of eligible) {
        let score = 1; // kleine Ganzzahl ist nur ein schwaches Signal
        const leftWord = /[\p{L}\p{N})\]]\s*$/u.test(c.left);
        const rightWord = /^\s*[\p{L}(\[]/u.test(c.right);
        const rightPunctuation = /^\s*[.,;:!?)]/u.test(c.right);
        const spacedBeforePunctuation = /^\s+[.,;:!?)]/u.test(c.right);

        if (leftWord && rightWord) score += 2;
        if (leftWord && rightPunctuation) score += 2;
        const sentenceEndBefore = /[.!?]["'»“”’)]?\s*$/u.test(c.left);
        const newSentenceAfter = /^\s*["'„“»]?\s*[A-ZÄÖÜ]/u.test(c.right);
        if (sentenceEndBefore && rightWord) score += 2;
        // V10.4.4: Satzende + isolierte Zahl + neuer Satzbeginn ist ein starkes
        // Fußnotensignal. Absolute Struktur-/Einheitenbindungen wurden bereits
        // vorab geschützt und können diese Regel nicht auslösen.
        if (sentenceEndBefore && newSentenceAfter) score += 3;
        if (spacedBeforePunctuation) score += 1;
        if (sequenceLikely) score += 3;

        // Besonders typische PDF-Fußnotenposition: Wort + Zahl + getrenntes Satzzeichen.
        if (/\p{L}\s+$/u.test(c.left) && /^\s+[.,;:!?]/u.test(c.right)) score += 2;

        c.score = score;
        c.remove = score >= 5;
    }

    const removable = candidates.filter(c => c.remove);
    const uncertain = eligible.filter(c => !c.remove);
    audit.removedProbableFootnoteMarkers += removable.length;
    audit.uncertainFootnoteNumberCandidates += uncertain.length;
    audit.detectedFootnoteNumberSequence = sequenceLikely ? 1 : 0;

    if (!removable.length) return text;
    let result = text;
    for (const c of removable.slice().sort((a, b) => b.start - a.start)) {
        result = result.slice(0, c.start) + result.slice(c.end);
    }
    return result;
}

function protectTechnicalSpans(text) {
    const store = createProtectionStore();
    let result = text;

    const protect = (regex, category, normalizeWhitespace = true) => {
        result = result.replace(regex, match => storeProtectedValue(store, match, category, normalizeWhitespace));
    };

    protect(/\b(?:https?:\/\/|www\.)[^\s<>()]+|\b(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+(?:de|com|org|net|edu|gov|info|biz|eu|at|ch)(?:\/[^\s<>()]*)?/giu, "urlsEmails", false);
    protect(/\b[\w.%+-]+@[\w.-]+\.[A-Za-z]{2,}\b/gu, "urlsEmails", false);
    protect(new RegExp("\\b\\d{1,2}\\.\\s+(?:" + GERMAN_MONTHS + ")(?:\\s+\\d{4})?\\b", "giu"), "dates");
    protect(/\b(?:S|Seite|Seiten|Abb|Abbildung|Tab|Tabelle|Kap|Kapitel|Nr)\.\s*\d+(?:[.,-]\d+)*(?:\s*ff?\.?)?/giu, "sourceRefs");
    protect(/(?:§{1,2}|Paragraf(?:en)?)\s*\d+[a-z]?(?:\s*(?:Abs\.|Absatz|Satz|Nr\.)\s*\d+)?/giu, "sourceRefs");
    protect(/\b\d+(?:[.,]\d+)?\s*(?:%|Prozent|€|EUR|\$|USD|km\/h|m\/s|kg\/h|t\/h|kWh|MWh|W\/(?:\([^\n]{1,20}\)|[A-Za-z]+)|mm|cm|km|kg|mg|ml|Hz|Pa|bar)(?=\s|$|[.,;:!?])/giu, "measurements");
    protect(/\b(?:TCP\/IP|CCS\/MCS|HPC\/MCS|RDS\/TMC|SFB\/TR|SFB\/Transregio)\b/giu, "technicalSlashes");
    protect(/\b[A-Z0-9]{2,12}(?:\/[A-Z0-9]{2,12})+\b/gu, "technicalSlashes");
    for (const definition of GENDER_FORM_DEFINITIONS) {
        protect(definition.regex, "genderForms", false);
    }
    protect(/\b[\p{L}\p{N}][\p{L}\p{N}.+-]{0,39}\s*&\s*[\p{L}\p{N}][\p{L}\p{N}.+-]{0,39}\b/gu, "ampersandSpans", true);
    OCR_PROTECTED_CODE_REGEXES.forEach(regex => protect(regex, "codesProducts", false));

    ABBREVIATIONS
        .slice()
        .sort((a, b) => b.length - a.length)
        .forEach(abbreviation => {
            const regex = createAbbreviationRegex(abbreviation);
            result = result.replace(regex, (match, prefix, abbreviationHit) => {
                return prefix + storeProtectedValue(store, abbreviationHit, "abbreviations", true);
            });
        });

    return { text: result, store };
}

function restoreProtectedSpans(text, store) {
    let result = text;
    store.values.forEach((value, index) => {
        const token = PROTECTION_TOKEN_OPEN + "P" + index + PROTECTION_TOKEN_CLOSE;
        result = result.split(token).join(value);
    });
    const placeholderLeakCount = (result.match(/[\uE000\uE001\uE100-\uE102]/gu) || []).length;
    return { text: result, placeholderLeakCount };
}

function repairLineBreakHyphenations(text, audit) {
    const connectorWords = new Set(["und", "oder", "bzw", "beziehungsweise", "respektive"]);
    let result = text.replace(/([\p{L}\p{N}]{1,50})([-\u2010\u2011])[ \t]*\n[ \t]*([\p{L}\p{N}]{1,50})/gu,
        (match, left, hyphen, right, offset, whole) => {
            const lowerLeft = left.toLocaleLowerCase("de-DE");
            const lowerRight = right.toLocaleLowerCase("de-DE");
            if (connectorWords.has(lowerRight)) {
                audit.retainedLineBreakHyphens++;
                return left + hyphen + " " + right;
            }
            const rightStartsLower = /^\p{Ll}/u.test(right);
            const leftIsAcronym = /^[A-ZÄÖÜ0-9]{2,}$/u.test(left);
            const rightStartsUpperOrDigit = /^[\p{Lu}\p{N}]/u.test(right);
            const prior = whole.slice(Math.max(0, offset - 50), offset) + left;
            const knownTrueHyphen = TRUE_HYPHEN_LEFT_PARTS.has(lowerLeft) ||
                /(?:proof-under-real-world|end-to-end|just-in-time|make-or-buy)$/iu.test(prior);
            if (rightStartsLower && left.length === 1 && !leftIsAcronym) {
                audit.unclearLineBreakHyphenations++;
                return left + hyphen + right;
            }
            if (rightStartsLower && !leftIsAcronym && !knownTrueHyphen) {
                audit.repairedPdfHyphenations++;
                return left + right;
            }
            if (rightStartsUpperOrDigit || leftIsAcronym || knownTrueHyphen) {
                audit.retainedLineBreakHyphens++;
                return left + hyphen + right;
            }
            audit.unclearLineBreakHyphenations++;
            return left + hyphen + right;
        });

    result = result.replace(/([-\u2010\u2011])[ \t]*\n[ \t]*/gu, (match, hyphen, offset, whole) => {
        audit.retainedLineBreakHyphens++;
        const next = whole[offset + match.length] || "";
        return /[\p{L}\p{N}]/u.test(next) ? hyphen : hyphen + " ";
    });
    return result;
}

function createOcrData() {
    return {
        repairs: [],
        suspects: [],
        possibleHeadings: [],
        possibleHeadersFooters: []
    };
}

function recordOcrRepair(audit, ocrData, original, replacement, safety, kind) {
    ocrData.repairs.push({ original, replacement, safety, kind });
    if (safety === "A") audit.ocrSafetyA++;
    if (safety === "B") audit.ocrSafetyB++;
    if (kind === "wordFragment") audit.repairedOcrWordFragments++;
    if (kind === "characterConfusion") audit.repairedOcrCharacterConfusions++;
    if (kind === "hyphenSpacing") audit.repairedOcrHyphenSpacing++;
    if (kind === "sentenceAdhesion") audit.repairedOcrSentenceAdhesions++;
    if (kind === "listBoundary") audit.repairedOcrListBoundaries++;
    if (kind === "definitionColon") audit.repairedDefinitionColonSpacing++;
}

function applyOcrRepairRules(text, audit, ocrData) {
    let result = text;
    for (const rule of OCR_REPAIR_RULES) {
        result = result.replace(rule.regex, (...args) => {
            const match = args[0];
            const replacement = typeof rule.replacement === "function"
                ? rule.replacement(match)
                : rule.replacement;
            recordOcrRepair(audit, ocrData, match, replacement, rule.safety, rule.kind);
            return replacement;
        });
    }

    result = result.replace(/\b([A-ZÄÖÜ]{2,}|[\p{L}-]+)[ \t]+-[ \t]*(?=[A-ZÄÖÜ])/gu,
        (match, left) => {
            const normalized = left.toLocaleLowerCase("de-DE");
            if (!/^[A-ZÄÖÜ]{2,}$/u.test(left) && !OCR_TECHNICAL_HYPHEN_PREFIXES.has(normalized)) {
                return match;
            }
            const replacement = left + "-";
            recordOcrRepair(audit, ocrData, match, replacement, "A", "hyphenSpacing");
            return replacement;
        });

    result = result.replace(/([-\u2010\u2011])[ \t]*\/\s*(?=[\p{L}\p{N}])/gu,
        match => {
            const replacement = match.replace(/\s/g, "");
            if (replacement !== match) {
                recordOcrRepair(audit, ocrData, match, replacement, "A", "hyphenSpacing");
            }
            return replacement;
        });

    result = result.replace(/^([ \t]*)([\p{L}\p{N}.+-]+(?:[ \t]+(?:[IVXLCDM]{1,8}|[A-ZÄÖÜ0-9.-]+))?)[ \t]+:[ \t]*/gmu,
        (match, indent, label) => {
            const replacement = indent + label.trim() + ": ";
            if (replacement !== match) {
                recordOcrRepair(audit, ocrData, match, replacement, "A", "definitionColon");
            }
            return replacement;
        });

    result = result.replace(/\.-[ \t]+(?=[A-ZÄÖÜ])/gu, match => {
        const replacement = ".\n\n";
        recordOcrRepair(audit, ocrData, match, replacement, "A", "listBoundary");
        return replacement;
    });

    result = result.replace(/([.!?])(?=[A-ZÄÖÜ][\p{L}\p{N}-]{2,})/gu,
        (match, punctuation) => {
            const replacement = punctuation + " ";
            recordOcrRepair(audit, ocrData, match, replacement, "A", "sentenceAdhesion");
            return replacement;
        });

    return result;
}

function normalizeOcrLayout(text, audit, ocrData) {
    const lines = text.split("\n");
    const trimmed = lines.map(line => line.trim());
    const occurrences = new Map();
    for (let index = 0; index < trimmed.length; index++) {
        const line = trimmed[index];
        if (!line || line.length < 3 || line.length > 70 || /[.!?;:]$/u.test(line)) continue;
        const wordCount = (line.match(/[\p{L}\p{N}]+/gu) || []).length;
        if (wordCount > 10) continue;
        if (!occurrences.has(line)) occurrences.set(line, []);
        occurrences.get(line).push(index);
    }

    const removableRepeated = new Set();
    for (const [line, indexes] of occurrences.entries()) {
        if (indexes.length < 3) continue;
        const spread = Math.max(...indexes) - Math.min(...indexes);
        if (spread < 8) continue;
        indexes.forEach(index => removableRepeated.add(index));
        audit.removedRepeatedHeadersFooters += indexes.length;
        ocrData.possibleHeadersFooters.push(line + " → als wiederholte Kopf-/Fußzeile entfernt");
    }

    for (let index = 0; index < lines.length; index++) {
        if (removableRepeated.has(index)) {
            lines[index] = "";
            continue;
        }
        const line = trimmed[index];
        if (/^\d{1,4}$/u.test(line)) {
            let previous = index - 1;
            let next = index + 1;
            while (previous >= 0 && !trimmed[previous]) previous--;
            while (next < lines.length && !trimmed[next]) next++;
            if (previous >= 0 && next < lines.length &&
                !/[.!?;:]$/u.test(trimmed[previous]) && /^\p{Ll}/u.test(trimmed[next])) {
                ocrData.repairs.push({ original: line, replacement: "entfernt", safety: "B", kind: "pageNumber" });
                audit.ocrSafetyB++;
                audit.removedIsolatedPageNumbers++;
                lines[index] = "";
                continue;
            }
        }
        if (/^\d+(?:\.\d+)*\.\s+[A-ZÄÖÜ][^\n]{2,70}$/u.test(line) &&
            (line.match(/[\p{L}\p{N}]+/gu) || []).length <= 8) {
            audit.possibleInsertedHeadings++;
            audit.segmentedHeadings++;
            audit.ocrSafetyC++;
            ocrData.possibleHeadings.push(line);
            lines[index] = HEADING_SENTINEL + line;
            continue;
        }
        if (/^(?:Abb\.|Abbildung|Bild|Tab\.|Tabelle)\s*\d+\s*:\s*[^\n]{2,140}$/iu.test(line)) {
            audit.segmentedCaptions++;
            lines[index] = CAPTION_SENTINEL + line;
        }
    }
    return lines.join("\n");
}

function detectUnresolvedOcrArtifacts(text, audit, ocrData) {
    const accepted = new Set();
    for (const item of OCR_UNRESOLVED_PATTERNS) {
        const regex = new RegExp(item.regex.source, item.regex.flags.includes("g") ? item.regex.flags : item.regex.flags + "g");
        let match;
        while ((match = regex.exec(text)) !== null) {
            const key = match.index + ":" + match[0];
            if (!accepted.has(key)) {
                accepted.add(key);
                audit.ocrSafetyC++;
                audit.ocrSuspectsTotal++;
                if (item.kind === "wordFragment") audit.unresolvedOcrWordFragments++;
                if (item.kind === "characterConfusion") audit.unresolvedOcrCharacterConfusions++;
                ocrData.suspects.push(match[0] + " → " + item.label);
            }
            if (match.index === regex.lastIndex) regex.lastIndex++;
        }
    }
    const fragmentRegex = /\b(?:Arbeits\s+welt|Tei\s+len|Lea\s+dership|deutschspra\s+chigen|näm\s+lich|Ver\s+änderungen|Indu\s*-\s*striebetrieben|Perspek\s*-\s*tiven|Qualifizierungspro\s*-\s*gramme|Diffe\s*-\s*renzierungsmerkmal|Arbeitswissen\s*-\s*schaft|Siche\s+rung)\b/giu;
    let fragment;
    while ((fragment = fragmentRegex.exec(text)) !== null) {
        const key = fragment.index + ":" + fragment[0];
        if (!accepted.has(key)) {
            accepted.add(key);
            audit.ocrSafetyC++;
            audit.ocrSuspectsTotal++;
            audit.unresolvedOcrWordFragments++;
            ocrData.suspects.push(fragment[0] + " → möglicher OCR-Wortbruch");
        }
        if (fragment.index === fragmentRegex.lastIndex) fragmentRegex.lastIndex++;
    }
}

function parseListMarker(line) {
    const definite = line.match(/^([ \t]*)([•·‣⁃▪■□◦●○→►◆✓])(?:[ \t]+)(.+)$/u);
    if (definite) return { indent: definite[1].length, marker: definite[2], body: definite[3], type: "symbol", definite: true };

    const dash = line.match(/^([ \t]*)([-–—*+])(?:[ \t]+)(.+)$/u);
    if (dash) return { indent: dash[1].length, marker: dash[2], body: dash[3], type: "dash", definite: false };

    const numeric = line.match(/^([ \t]*)(\(?([0-9]{1,3})\)?[.)])(?:[ \t]+)(.+)$/u);
    if (numeric) {
        if (new RegExp("^(?:" + GERMAN_MONTHS + ")\\b", "iu").test(numeric[4])) return null;
        return { indent: numeric[1].length, marker: numeric[2], number: Number(numeric[3]), body: numeric[4], type: "numeric", definite: false };
    }

    const alpha = line.match(/^([ \t]*)(\(?([A-Za-z])\)?[.)])(?:[ \t]+)(.+)$/u);
    if (alpha) return { indent: alpha[1].length, marker: alpha[2], body: alpha[4], type: "alpha", definite: false };

    const roman = line.match(/^([ \t]*)(\(?([IVXLCDM]{1,8})\)?[.)])(?:[ \t]+)(.+)$/u);
    if (roman) return { indent: roman[1].length, marker: roman[2], body: roman[4], type: "roman", definite: false };
    return null;
}

function normalizeListBlocks(text, audit) {
    const lines = text.split("\n");
    const candidates = lines.map(parseListMarker);
    const remove = new Array(lines.length).fill(false);

    const nearestCandidate = (index, direction) => {
        let cursor = index + direction;
        while (cursor >= 0 && cursor < lines.length) {
            if (lines[cursor].trim() === "") return null;
            if (candidates[cursor]) return { index: cursor, candidate: candidates[cursor] };
            // Eine umgebrochene Fortsetzungszeile darf zwischen zwei Markern liegen.
            if (Math.abs(cursor - index) > 2) return null;
            cursor += direction;
        }
        return null;
    };

    for (let index = 0; index < lines.length; index++) {
        const candidate = candidates[index];
        if (!candidate) continue;
        if (candidate.definite) {
            remove[index] = true;
            continue;
        }
        const previous = nearestCandidate(index, -1);
        const next = nearestCandidate(index, 1);
        const matchingNeighbor = [previous, next].some(item => item && item.candidate.type === candidate.type);
        const numericSequence = candidate.type === "numeric" && [previous, next].some(item => item && item.candidate.type === "numeric" && Math.abs(item.candidate.number - candidate.number) === 1);
        const introducedByColon = (() => {
            let cursor = index - 1;
            while (cursor >= 0 && lines[cursor].trim() === "") cursor--;
            return cursor >= 0 && /:\s*$/u.test(lines[cursor]);
        })();
        if (matchingNeighbor || numericSequence || candidate.indent >= 2 || introducedByColon) {
            remove[index] = true;
        } else {
            audit.protectedPotentialListMarkers++;
            audit.unclearListStarts++;
        }
    }

    let inBlock = false;
    for (let index = 0; index < lines.length; index++) {
        if (remove[index]) {
            if (!inBlock) audit.listBlocks++;
            inBlock = true;
            audit.removedListMarkers++;
            audit.normalizedListMarkers++;
            lines[index] = LIST_ITEM_SENTINEL + candidates[index].body;
        } else if (lines[index].trim() === "") {
            inBlock = false;
        }
    }
    return lines.join("\n");
}

function reconstructParagraphs(text, audit) {
    const lines = text.split("\n");
    const paragraphs = [];
    let current = [];
    let currentIsList = false;
    const flush = () => {
        if (current.length > 0) {
            const paragraph = current.join(" ").trim();
            paragraphs.push(currentIsList ? "- " + paragraph : paragraph);
            current = [];
        }
        currentIsList = false;
    };

    for (const rawLine of lines) {
        const line = rawLine.trim();
        if (!line) {
            if (current.length > 0) audit.paragraphBreaks++;
            flush();
            continue;
        }
        if (line.startsWith(LIST_ITEM_SENTINEL)) {
            flush();
            current.push(line.slice(LIST_ITEM_SENTINEL.length).trim());
            currentIsList = true;
            continue;
        }
        if (line.startsWith(HEADING_SENTINEL) || line.startsWith(CAPTION_SENTINEL)) {
            flush();
            paragraphs.push(line.slice(1).trim());
            continue;
        }
        const currentText = current.join(" ").trim();
        const newProseAfterDefinition = currentIsList &&
            /^[^:]{1,40}:\s+\S/u.test(currentText) &&
            /^(?:Das|Der|Die|Ein|Eine|Im|In|Diese|Dieser|Dieses|Zudem|Danach|Anschließend|Mitte|Seit|Während|Für|Auf)\b/u.test(line) &&
            !/[,;:–-]\s*$/u.test(currentText);
        if (newProseAfterDefinition) {
            flush();
            current.push(line);
            continue;
        }

    const long10Count = lengths.filter(length => length >= 10).length;
    const long12Count = lengths.filter(length => length >= 12).length;
    const long16Count = lengths.filter(length => length >= 16).length;

        meanWordLength: mean,
        wordLengthSD: Math.sqrt(variance),

        long7Count,
        ratioLong7: long7Count / wordCount,

function interpolateLIXCalibration(rawValue) {
    const raw = Number(rawValue);
    if (!Number.isFinite(raw)) throw new Error("Ungültiger LIX-Rohwert.");
    const c = LIX_EMPIRICAL_CALIBRATION_V13.LIX;
    const knots = c.knots;
    const first = knots[0];
    const last = knots[knots.length - 1];
    if (raw < first[0]) {
        const delta = first[0] - raw;
        const percentile = Math.max(0, first[1] * Math.exp(-c.lowerTailLambda * delta));
        return { percentile, calibrated: Math.max(0, first[2] - c.lowerTailTargetSlope * delta), extrapolated: true };
    }
    if (raw > last[0]) {
        const delta = raw - last[0];
        const survival = (1 - last[1]) * Math.exp(-c.upperTailLambda * delta);
        const percentile = Math.min(1 - Number.EPSILON, Math.max(last[1], 1 - survival));
        return { percentile, calibrated: last[2] + c.upperTailTargetSlope * delta, extrapolated: true };
    }
    let low = 0, high = knots.length - 1;
    while (high - low > 1) {
        const mid = (low + high) >> 1;
        if (knots[mid][0] <= raw) low = mid; else high = mid;
    }
    const left = knots[low], right = knots[high];
    if (Math.abs(raw - left[0]) <= 1e-15) return { percentile: left[1], calibrated: left[2], extrapolated: false };
    if (Math.abs(raw - right[0]) <= 1e-15) return { percentile: right[1], calibrated: right[2], extrapolated: false };
    const t = (raw - left[0]) / Math.max(Number.EPSILON, right[0] - left[0]);
    return { percentile: left[1] + t * (right[1] - left[1]), calibrated: left[2] + t * (right[2] - left[2]), extrapolated: false };
}

function interpolateCalibration1014(rawValue, factorKey) {
    const raw = Math.max(0, Number(rawValue) || 0);
    if (raw === 0) return { percentile: 0, gamma: 0, extrapolated: false };

    const calibration = BCF_EMPIRICAL_CALIBRATION_1014[factorKey];
    const knots = calibration.knots;
    if (!knots || knots.length === 0) return { percentile: 0, gamma: 0, extrapolated: false };

    const first = knots[0];
    if (raw <= first[0]) {
        const t = raw / Math.max(Number.EPSILON, first[0]);
        return {
            percentile: t * first[1],
            gamma: t * first[2],
            extrapolated: false
        };
    }

    const last = knots[knots.length - 1];
    if (Math.abs(raw - last[0]) <= 1e-12) {
        return { percentile: last[1], gamma: last[2], extrapolated: false };
    }
    if (raw > last[0]) {
        const delta = raw - last[0];
        const survival = (1 - last[1]) * Math.exp(-calibration.tailLambda * delta);
        const percentile = Math.min(1 - Number.EPSILON, Math.max(last[1], 1 - survival));
        return {
            percentile,
            gamma: last[2] + calibration.tailTargetSlope * delta,
            extrapolated: true
        };
    }

    let low = 0;
    let high = knots.length - 1;
    while (high - low > 1) {
        const mid = (low + high) >> 1;
        if (knots[mid][0] <= raw) low = mid;
        else high = mid;
    }
    const left = knots[low];
    const right = knots[high];
    if (Math.abs(raw - left[0]) <= 1e-15) {
        return { percentile: left[1], gamma: left[2], extrapolated: false };
    }
    if (Math.abs(raw - right[0]) <= 1e-15) {
        return { percentile: right[1], gamma: right[2], extrapolated: false };
    }
    const t = (raw - left[0]) / Math.max(Number.EPSILON, right[0] - left[0]);
    return {
        percentile: left[1] + t * (right[1] - left[1]),
        gamma: left[2] + t * (right[2] - left[2]),
        extrapolated: false
    };
}

    };
    const unbounded = {
        B: 0.25 * unboundedComponents.B1 + 0.20 * unboundedComponents.B2 + 0.25 * unboundedComponents.B3 + 0.15 * unboundedComponents.B4 + 0.15 * unboundedComponents.B5,
        C: 0.25 * unboundedComponents.C1 * c1IsolationFactorUnbounded + 0.20 * unboundedComponents.C2 + 0.20 * unboundedComponents.C3 + 0.25 * C4Unbounded * cMarketingFactorUnbounded * cConcreteFactor + 0.10 * unboundedComponents.C5,
        F: 0.20 * unboundedComponents.F1 + 0.20 * unboundedComponents.F2 + 0.25 * unboundedComponents.F3 + 0.25 * unboundedComponents.F4 + 0.10 * unboundedComponents.F5
    };
    const mappedB = interpolateCalibration1014(unbounded.B, "B");
    const mappedC = interpolateCalibration1014(unbounded.C, "C");
    const mappedF = interpolateCalibration1014(unbounded.F, "F");
    const reliability = (data.wordCount < 50 || data.sentenceCount < 3 || data.originalCharCount < 300) ? "ungenügend" : (data.wordCount < 150 || data.sentenceCount < 9 || data.originalCharCount < 900) ? "eingeschränkt" : "regulär";

    return {
        B: mappedB.gamma,
        C: mappedC.gamma,
        F: mappedF.gamma,
        reliability,
        linear,
        unbounded,
        percentile: { B: mappedB.percentile, C: mappedC.percentile, F: mappedF.percentile },
        extrapolated: { B: mappedB.extrapolated, C: mappedC.extrapolated, F: mappedF.extrapolated },
        components: { ...components, C4 },
        unboundedComponents: { ...unboundedComponents, C4: C4Unbounded },
        raw: {
            phrasePerSentence,
            nominalWeightedCount,
            nominalWeightedRatio,
            passivePerClause,
            fvgPerSentence,
            actorPerClause,
            weakModalWeightedCount,
            weakModalRatio,
            cascadeExcessPerSentence,
            hinterdoorCount,
            hinterdoorRatio,
            liabilityAvoidanceCount,
            liabilityCascadeCount,
            bcfUnboundWeightedRatio: data.abstractionClusterData.bcfUnboundWeightedRatio,
            effectiveConditionScopeRatio: data.conditionScopeData.effectiveRatio,
            c1IsolationFactor,
            c1IsolationFactorUnbounded
        }
    };
}

function countDiagnosticOverlaps9916(tokenData, jargonData, suffixData, nominalizationData, modalData, decisionData) {
    const jargon = new Set();
    for (const family of JARGON_FAMILIES) for (const hit of jargonData.results[family.key].hits) jargon.add(normalizeToken(hit));
    const suffix = new Set(suffixData.hits.map(normalizeToken));
    let jargonSuffix = 0;
    for (const token of tokenData) if (jargon.has(token.normalized) && suffix.has(token.normalized)) jargonSuffix++;
    const nominalSuffix = nominalizationData.hits.filter(hit => suffixData.hits.some(word => hit.includes(word))).length;
    const uncertainLabels = new Set((decisionData.groups.uncertainConditions?.hits || []).map(hit => hit.split(" → ")[0].toLocaleLowerCase("de-DE")));
    const modalUncertain = modalData.hits.filter(hit => uncertainLabels.has(hit.toLocaleLowerCase("de-DE"))).length;
    return { jargonSuffix, nominalSuffix, modalUncertain };
}

function escapeHTML(value) {
    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function metric(label, value) {
    return '<div class="metric"><span class="metric-label">' +
        escapeHTML(label) + ':</span><span class="metric-value">' +
        escapeHTML(value) + "</span></div>";
}

function hitDetails(label, data, supplement = "") {
    const content = data.hits.length > 0
        ? data.hits.map(escapeHTML).join("; ")
        : "keine Treffer";
    const suffix = supplement ? " · " + supplement : "";

    return '<details class="hit-details"><summary>' +
        escapeHTML(label) + " – " + data.count + " Treffer" +
        escapeHTML(suffix) +
        '</summary><div class="hit-list">' +
        content + "</div></details>";
}

function renderJargonFamilies(familyData) {
    let html = "";
    let currentTier = "";

    for (const family of JARGON_FAMILIES) {
        const result = familyData.results[family.key];
        if (family.tier !== currentTier) {
            currentTier = family.tier;
            html += '<div class="subsection-header">' + escapeHTML(currentTier) + "</div>";
        }
        html += hitDetails(
            family.label,
            result,
            "Dichte " + result.ratio.toFixed(4)
        );
    }

    return html;
}

function computeDTAComponents(data) {
    const scores = [
        data.bcfData.B,
        data.bcfData.C,
        data.bcfData.F,
        data.predictedBlaBlaMeterIndex,
        data.lixCalibrated
    ].map(Number);

    if (!scores.every(score => Number.isFinite(score) && score >= 0)) {
        throw new Error("Das DTA-Profil benötigt endliche, nichtnegative Scores.");
    }

    const dimension = scores.length;
    const mean = scores.reduce((sum, score) => sum + score, 0) / dimension;
    const P = scores.reduce((sum, score) => sum + score, 0) / Math.sqrt(dimension);
    const Q = Math.sqrt(scores.reduce((sum, score) => sum + Math.pow(score - mean, 2), 0));
    const R = Math.hypot(P, Q);
    return { P, Q, R, mean, dimension, scores };
}

function renderTransformationLog(data) {
    const groups = [
        ["Klammerblöcke – aus überarbeitetem Text entfernt", data.transformations.brackets],
        ["Schrägstrich-Quellenmarker – aus überarbeitetem Text entfernt", data.transformations.slashCitations],
        ["URLs – nur Diagnose", data.transformations.urls],
        ["Starke Alternativkoppler – keine Veränderung", data.transformations.strongAlternatives],
        ["Schrägstrichkonstruktionen – keine Veränderung", data.transformations.slashAlternatives],
        ["Abschwächer – keine Veränderung", data.transformations.hedgeFillers],
        ["Proaktiv-Redundanzen – keine Veränderung", data.transformations.proactiveRedundancies],
        ["Entfernte Schutzrechtsmarker", data.transformations.protectionMarkers],
        ["OCR-Reparaturen", data.transformations.ocrRepairs],
        ["Ungeklärte OCR-Verdachtsfälle", data.transformations.ocrSuspects],
        ["Möglicherweise eingeschobene Überschriften", data.transformations.possibleHeadings],
        ["Kopf- und Fußzeilenbefunde", data.transformations.possibleHeadersFooters]
    ];
    let html = '<div class="section-header">Transformationsprotokoll</div>';
    for (const [label, entries] of groups) {
        const hits = entries.map(entry => entry.original + " → " + entry.replacement);
        html += hitDetails(label, { count: entries.length, hits });
    }
    return html;
}

function computeDTAIndex(data) {
    return computeDTAComponents(data).R;
}

function formatDTAValue(value) {
    const numeric = Number(value);
    if (!Number.isFinite(numeric)) {
        throw new Error("Ungültiger DTA-Gesamtwert.");
    }
    return numeric.toFixed(3).replace(".", ",");
}

function formatDateDDMMYYYY(date) {
    const day = String(date.getDate()).padStart(2, "0");
    const month = String(date.getMonth() + 1).padStart(2, "0");
    return day + "." + month + "." + date.getFullYear();
}

function formatDateTimeDDMMYYYY(value) {
    const date = value instanceof Date ? value : new Date(value);
    if (!Number.isFinite(date.getTime())) return "—";
    const hours = String(date.getHours()).padStart(2, "0");
    const minutes = String(date.getMinutes()).padStart(2, "0");
    const seconds = String(date.getSeconds()).padStart(2, "0");
    return formatDateDDMMYYYY(date) + ", " + hours + ":" + minutes + ":" + seconds + " Uhr";
}

function renderDTAResult(data) {
    const quantityWarning = data.textQuantityStatus === "critical"

        : '';
    return (
        '<div class="dta-result">' +
        '<div class="dta-title">DEUTSCHES TEXT-AUDIT (DTA)</div>' +
        '<div class="dta-result-grid">' +
        '<div class="dta-result-left">' +
        '<div class="dta-line"><span>Analysierte Zeichen:</span><strong>' + data.analyzedCharCount + '</strong></div>' +
        '<div class="dta-line"><span>Gefundene Wörter:</span><strong>' + data.wordCount + '</strong></div>' +
        '<div class="dta-line"><span>Gefundene Sätze:</span><strong>' + data.sentenceCount + '</strong></div>' +
        '<div class="dta-line dta-index-line"><span>DTA P:</span><strong>' + formatDTAValue(data.dtaP) + '</strong></div>' +
        '<div class="dta-line dta-index-line"><span>DTA Q:</span><strong>' + formatDTAValue(data.dtaQ) + '</strong>' + quantityWarning + '</div>' +
        '</div>' + renderPQMap(data, true) +

        '<div class="dta-meta">' +
        'Version: V' + getDtaRuntimeVersion() + '<br>' +

        'Analysezeitpunkt: ' + formatDateTimeDDMMYYYY(data.analysisTimestamp) +
        '</div>' +

    );
}

function analyzeText() {
    closeAllInsights();
    const analysisTimestamp = new Date();
    const rawText = document.getElementById("textInput").value;
    if (!rawText.trim()) {
        document.getElementById("result").innerHTML = "Bitte gib einen Text ein.";
        return;
    }

    const prepared = prepareText(rawText);
    const originalText = prepared.originalText;
    const technicalText = prepared.technicalText;
    const revisedText = prepared.revisedText;
    const originalTextSha256 = sha256Utf8(originalText);
    const technicalTextSha256 = sha256Utf8(technicalText);
    const revisedTextSha256 = sha256Utf8(revisedText);
    document.getElementById("textInput").value = revisedText;

    const boilerplateData = detectBoilerplate9916(revisedText);
    const evaluableText = selectEvaluableText9920(revisedText, boilerplateData);
    const analysisNeutralizationData = neutralizeNonGermanAnalysisSpans1072(evaluableText);
    const analysisText = analysisNeutralizationData.text;
    const technicalWords = tokenize(technicalText);
    const revisedWords = tokenize(revisedText);
    const words = tokenize(analysisText);
    const tokenData = words.map(original => ({ original, normalized: normalizeToken(original) }));
    const wordCount = tokenData.length;
    const technicalWordCount = technicalWords.length;
    const revisedWordCount = revisedWords.length;
    const removedBracketWordCount = Math.max(0, technicalWordCount - revisedWordCount);

    prepared.technicalAudit.technicalChangesPerThousandWords = prepared.technicalAudit.technicalChangesTotal * 1000 / Math.max(1, technicalWordCount);
    prepared.technicalAudit.ocrRepairsRatio = prepared.technicalAudit.ocrRepairsTotal / Math.max(1, technicalWordCount);
    prepared.technicalAudit.ocrRepairsPerThousandWords = prepared.technicalAudit.ocrRepairsTotal * 1000 / Math.max(1, technicalWordCount);
    prepared.technicalAudit.ocrSuspectsRatio = prepared.technicalAudit.ocrSuspectsTotal / Math.max(1, technicalWordCount);
    prepared.technicalAudit.ocrRestPerThousandWords = prepared.technicalAudit.ocrSuspectsTotal * 1000 / Math.max(1, technicalWordCount);

    const sentences = sentenceUnits(analysisText);
    const sentenceCount = sentences.length;
    const textQuantityStatus = classifyTextQuantity(analysisText.length, wordCount, sentenceCount);
    if (textQuantityStatus === "insufficient") {
        lastAnalysisData = null;
        document.getElementById("result").innerHTML = renderInsufficientTextResult({
            analyzedCharCount: analysisText.length,
            wordCount,
            sentenceCount,
            analysisTimestamp: analysisTimestamp.toISOString()
        });
        return;
    }

    const avgSentenceLength = wordCount / sentenceCount;
    const lengthData = wordLengthProfile(tokenData);
    const rawLix = avgSentenceLength + (100 * lengthData.ratioLong7);
    const jargonData = countFamilies9916(tokenData, JARGON_FAMILIES);
    const phraseCatalogData = countPhraseCatalog1010(analysisText, wordCount);
    const phraseData = phraseCatalogData.groups.jargon;
    const metaPhraseData = phraseCatalogData.groups.meta;
    const institutionalPhraseData = phraseCatalogData.groups.institutional;
    const suffixData = countBureaucracySuffixes(tokenData);
    const denglischData = countDenglisch9916(analysisText, tokenData);
    const nominalizationData = countNominalizations(analysisText, wordCount);
    const passiveData = countPassive9916(analysisText, tokenData);
    const uniqueDiagnosticData = countUniqueDiagnosticTokens(tokenData, jargonData, suffixData, denglischData);
    const modalProfileData = countModalProfile1010(tokenData, analysisText);
    const temporalReferenceData = countUnanchoredTemporalReferences1071(analysisText);
    const modalData = modalProfileData.total;
    const pronounData = countExactWords(tokenData, PERSONAL_PRONOUNS);
    const questionCount = (analysisText.match(/\?/g) || []).length;
    const decisionAvoidanceData = detectDecisionAvoidance9916(analysisText);
    const slashData = prepared.slashData;
    const abstractionClusterData = countAbstractionClusters9916(analysisText, wordCount);
    const evaluativeData = countEvaluativeLanguage1010(analysisText, wordCount);
    const redundancyData = countRedundancies1010(analysisText, wordCount);
    const functionVerbData = countFunctionVerbPhrases1010(analysisText, wordCount);
    const syntacticData = countSyntacticComplexity1010(analysisText);
    const actorSuppressionData = countActorSuppression1010(analysisText, syntacticData.clauseCount);
    const conditionScopeData = countConditionScopes1010(analysisText, wordCount);
    const hedgeClusterData = countHedgeClusters1028(analysisText);
    const estimatedFiniteVerbData = estimateFiniteVerbs1010(tokenData);
    const legalContextData = countLegalContext9916(analysisText, wordCount);
    const genderFormData = countGenderForms9916(analysisText, wordCount);
    const ampersandData = countAmpersands9916(analysisText, wordCount);
    const proactiveData = countProactive9916(analysisText);
    const diagnosticOverlapData = countDiagnosticOverlaps9916(tokenData, jargonData, suffixData, nominalizationData, modalData, decisionAvoidanceData);
    const protectionMarkerData = {
        ...prepared.protectionMarkerData,
        ratio: prepared.protectionMarkerData.totalCount / Math.max(1, technicalWordCount),
        perThousandWords: prepared.protectionMarkerData.totalCount * 1000 / Math.max(1, technicalWordCount)

    const slashCitationData = {
        ...prepared.slashCitationData,
        ratio: prepared.slashCitationData.count / Math.max(1, technicalWordCount),
        perThousandWords: prepared.slashCitationData.count * 1000 / Math.max(1, technicalWordCount)
    };

    lastAnalysisData = {
        originalText, technicalText, revisedText, evaluableText, analysisText, analysisNeutralizationData,
        originalTextSha256, technicalTextSha256, revisedTextSha256,
        originalCharCount: originalText.length,
        technicalCharCount: technicalText.length,
        revisedCharCount: revisedText.length,
        analyzedCharCount: analysisText.length,
        analysisTimestamp: analysisTimestamp.toISOString(),
        bracketBlockCount: prepared.bracketBlockCount,
        removedBracketChars: prepared.removedBracketChars,
        slashCitationData,
        technicalWordCount,
        revisedWordCount,
        removedBracketWordCount,
        wordCount,
        sentenceCount,
        textQuantityStatus,
        avgSentenceLength,
        rawLix,
        ...lengthData,
        jargonFamilyResults: jargonData.results,
        burdenedWordCount: jargonData.burdenedWordCount,
        familyHitCount: jargonData.familyHitCount,
        allFamilyHitCount: jargonData.allFamilyHitCount,
        allFamilyWordCount: jargonData.allFamilyWordCount,
        ratioBurdenedWords: jargonData.ratioBurdenedWords,
        ratioFamilyHits: jargonData.ratioFamilyHits,
        allFamilyRatio: jargonData.allFamilyRatio,
        jargonTierCounts: jargonData.tierCounts,
        jargonTierRatios: jargonData.tierRatios,
        phraseCatalogData,
        phraseData,
        metaPhraseData,
        institutionalPhraseData,
        suffixData,
        denglischData,
        uniqueDiagnosticData,
        nominalizationData,
        passiveData,
        passivePerSentence: passiveData.count / sentenceCount,
        modalProfileData,
        temporalReferenceData,
        modalData,
        pronounData,
        questionCount,
        questionsPerSentence: questionCount / sentenceCount,
        slashData,
        abstractionClusterData,
        evaluativeData,
        redundancyData,
        functionVerbData,
        syntacticData,
        actorSuppressionData,
        conditionScopeData,
        hedgeClusterData,
        estimatedFiniteVerbData,
        legalContextData,
        genderFormData,
        ampersandData,
        proactiveData,
        boilerplateData,
        diagnosticOverlapData,
        protectionMarkerData,
        punctuationData: prepared.punctuationData,
        ocrData: prepared.ocrData,
        urlData: prepared.urlData,
        technicalAudit: prepared.technicalAudit,
        transformations: prepared.transformations,
        decisionAvoidanceData,
        replacedAlternativeConnectorCount: 0,
        replacedAlternativeConnectorHits: [],
        replacedSlashAlternativeCount: prepared.replacedSlashAlternativeCount,
        replacedSlashAlternativeHits: prepared.replacedSlashAlternativeHits,
        removedHedgeFillerCount: 0,
        removedHedgeFillerHits: [],
        simplifiedProactiveRedundancyCount: 0,
        simplifiedProactiveRedundancyHits: []
    };

    lastAnalysisData.bcfData = computeBCF1012(lastAnalysisData);
    lastAnalysisData.nnValues = blaBlaMeterNNValues(lastAnalysisData);
    lastAnalysisData.predictedBlaBlaMeterIndex = predictBlaBlaMeter(lastAnalysisData.nnValues);
    const lixCalibration = interpolateLIXCalibration(lastAnalysisData.rawLix);
    lastAnalysisData.lixPercentile = lixCalibration.percentile;
    lastAnalysisData.lixCalibrated = lixCalibration.calibrated;
    lastAnalysisData.lixExtrapolated = lixCalibration.extrapolated;
    const dtaComponents = computeDTAComponents(lastAnalysisData);
    lastAnalysisData.dtaP = dtaComponents.P;
    lastAnalysisData.dtaQ = dtaComponents.Q;
    lastAnalysisData.dtaScore = dtaComponents.R;

    showBlaBlaMeterStage("revised");
    document.getElementById("result").innerHTML = renderMinimalResult(lastAnalysisData);
}
